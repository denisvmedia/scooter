name: Ptah integration proof
on:
  push:
    branches: [proof/ptah-4007]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: stokaro/ptah
          ref: 3b8f6a8e83d0537c551d09ae93e9e164d9b04174
          path: .proof/ptah
      - uses: actions/setup-go@v6
        with:
          go-version-file: .proof/ptah/go.mod
          cache-dependency-path: .proof/ptah/go.sum
      - name: Build the exact Ptah formatter fix (PR 4007)
        working-directory: .proof/ptah
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p "$RUNNER_TEMP/ptah-fixed"
          go build -o "$RUNNER_TEMP/ptah-fixed/atlas" ./cmd/ptah-compat
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
      - name: Validate with the fixed binary in Scooter's Nix shell
        run: |
          nix develop --command bash -euc '
            export PATH="$RUNNER_TEMP/ptah-fixed:$PATH"
            just db-validate
            just db-migrate-check
            just lint
            just db-generate-check
            just test-unit
            git diff --exit-code -- lib/sql/*/migrations
          '
      - name: Build the release package and migration image
        run: nix develop --command nix build .#ptah-compat .#db-migrator-image --no-link
