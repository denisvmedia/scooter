name: Ptah integration proof
on:
  push:
    branches: [proof/ptah-4007]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: nixbuild/nix-quick-install-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: scooter
      - name: Validate Ptah v0.12.0 in Scooter's Nix shell
        run: |
          nix develop --command bash -euc '
            atlas version
            just db-validate
            just db-migrate-check
            just lint
            just db-generate-check
            just test-unit
            git diff --exit-code -- lib/sql/*/migrations
          '
      - name: Verify Atlas handover, baseline adoption, and notifications
        run: |
          reference=$(nix build --impure --no-link --print-out-paths --expr 'let flake = builtins.getFlake (toString ./.); in flake.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.atlas')
          export ATLAS_REFERENCE="$reference/bin/atlas"
          nix develop --command bash .proof/handover.sh
      - name: Build the release package and migration image
        run: nix develop --command nix build .#ptah-compat .#db-migrator-image --no-link
